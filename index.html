                let t = r * 8 + c;
                if (!state[t]) moves.push({ from: idx, to: t, type: 'normal' });
                else { if (state[t].color !== color) moves.push({ from: idx, to: t, type: 'capture' }); break; }
                r += dr; c += dc;
            }
        }

        function isCellAttacked(cellIdx, attackerColor, state = boardState) {
            for (let i = 0; i < 64; i++) {
                if (state[i] && state[i].color === attackerColor) {
                    if (state[i].type === 'p') {
                        const r = Math.floor(i / 8), c = i % 8; const dir = attackerColor === 'w' ? -1 : 1;
                        for (let dc of [-1, 1]) { if (c + dc >= 0 && c + dc < 8 && (r + dir) * 8 + (c + dc) === cellIdx) return true; }
                    } else if (getPseudoMoves(i, state).some(m => m.to === cellIdx)) return true;
                }
            }
            return false;
        }

        function isKingInCheck(color, state = boardState) {
            const kIdx = state.findIndex(p => p && p.type === 'k' && p.color === color);
            return kIdx !== -1 && isCellAttacked(kIdx, color === 'w' ? 'b' : 'w', state);
        }

        function getValidMoves(idx, state = boardState) {
            const piece = state[idx]; if (!piece || piece.color !== currentTurn) return [];
            return getPseudoMoves(idx, state).filter(m => {
                let tempState = [...state]; tempState[m.to] = tempState[idx]; tempState[idx] = null;
                if (m.type === 'enPassant') tempState[m.to - (piece.color === 'w' ? -8 : 8)] = null;
                if (isKingInCheck(piece.color, tempState)) return false;
                const enemy = piece.color === 'w' ? 'b' : 'w';
                if (m.type === 'castle_king' && (isKingInCheck(piece.color, state) || isCellAttacked(idx + 1, enemy, state) || isCellAttacked(idx + 2, enemy, state))) return false;
                if (m.type === 'castle_queen' && (isKingInCheck(piece.color, state) || isCellAttacked(idx - 1, enemy, state) || isCellAttacked(idx - 2, enemy, state))) return false;
                return true;
            });
        }

        function getAllValidMoves(color, state = boardState) {
            let moves = [];
            for (let i = 0; i < 64; i++) { if (state[i] && state[i].color === color) moves.push(...getValidMoves(i, state)); }
            return moves;
        }
        // --- МНОГОПОТОЧНЫЙ ШАХМАТНЫЙ ИИ (ГЛУБИНА 4) БЕЗ ЗАВИСАНИЯ СТРАНИЦЫ ---
        const workerCode = `
            const PIECE_VALUES = { p: 10, n: 32, b: 33, r: 50, q: 90, k: 2000 };

            function evaluateBoard(state) {
                let score = 0;
                for (let i = 0; i < 64; i++) {
                    if (state[i]) {
                        let val = PIECE_VALUES[state[i].type]; let r = Math.floor(i / 8), c = i % 8;
                        if (r >= 2 && r <= 5 && c >= 2 && c <= 5) val += 1.5; 
                        if (r === 3 || r === 4) { if (c === 3 || c === 4) val += 1.0; }
                        if ((state[i].type === 'n' || state[i].type === 'b') && (r === 0 || r === 7)) val -= 1.0;
                        if (state[i].type === 'k' && (c === 1 || c === 2 || c === 6 || c === 7)) val += 2.0;
                        if (state[i].type === 'p') { val += (state[i].color === 'b' ? r : (7 - r)) * 0.2; }
                        score += (state[i].color === 'b') ? val : -val;
                    }
                }
                return score;
            }

            ${getPseudoMoves.toString()}
            ${addRayMoves.toString()}
            ${isCellAttacked.toString()}
            ${isKingInCheck.toString()}
            
            function getValidMovesWorker(idx, state, currentTurn) {
                const piece = state[idx]; if (!piece || piece.color !== currentTurn) return [];
                return getPseudoMoves(idx, state).filter(m => {
                    let tempState = [...state]; tempState[m.to] = tempState[idx]; tempState[idx] = null;
                    if (isKingInCheck(piece.color, tempState)) return false;
                    return true;
                });
            }

            function getAllValidMovesWorker(color, state) {
                let moves = [];
                for (let i = 0; i < 64; i++) { if (state[i] && state[i].color === color) moves.push(...getValidMovesWorker(i, state, color)); }
                return moves;
            }

            function minimax(state, depth, alpha, beta, isMaximizing) {
                if (depth === 0) return evaluateBoard(state);
                let moves = getAllValidMovesWorker(isMaximizing ? 'b' : 'w', state);
                if (moves.length === 0) return isMaximizing ? -9999 : 9999;
                moves.sort((a, b) => (state[b.to] ? 2 : 0) - (state[a.to] ? 2 : 0));

                if (isMaximizing) {
                    let maxEval = -Infinity;
                    for (let move of moves) {
                        let tempState = [...state]; tempState[move.to] = tempState[move.from]; tempState[move.from] = null;
                        let ev = minimax(tempState, depth - 1, alpha, beta, false);
                        maxEval = Math.max(maxEval, ev); alpha = Math.max(alpha, ev); if (beta <= alpha) break;
                    }
                    return maxEval;
                } else {
                    let minEval = Infinity;
                    for (let move of moves) {
                        let tempState = [...state]; tempState[move.to] = tempState[move.from]; tempState[move.from] = null;
                        let ev = minimax(tempState, depth - 1, alpha, beta, true);
                        minEval = Math.min(minEval, ev); beta = Math.min(beta, ev); if (beta <= alpha) break;
                    }
                    return minEval;
                }
            }

            self.onmessage = function(e) {
                const { boardState } = e.data;
                let moves = getAllValidMovesWorker('b', boardState);
                if (moves.length === 0) { self.postMessage(null); return; }

                let bestMove = moves[0]; let maxScore = -Infinity;
                for (let move of moves) {
                    let tempState = [...boardState]; tempState[move.to] = tempState[move.from]; tempState[move.from] = null;
                    // ГЛУБИНА 4 ХОДА: ИИ стал невероятно расчетливым
                    let score = minimax(tempState, 4, -Infinity, Infinity, false);
                    if (score > maxScore) { maxScore = score; bestMove = move; }
                }
                self.postMessage(bestMove);
            };
        `;

        const blob = new Blob([workerCode], { type: 'application/javascript' });
        const aiWorker = new Worker(URL.createObjectURL(blob));

        function makeAIMove() {
            if (!gameActive) return;
            document.getElementById('thinking-ui').style.display = 'flex';
            aiWorker.postMessage({ boardState });
        }

        aiWorker.onmessage = function(e) {
            document.getElementById('thinking-ui').style.display = 'none';
            const bestMove = e.data;
            if (bestMove) { executeMove(bestMove.from, bestMove.to, bestMove); } 
            else { finalizeTurn(); }
        };
        // --- ОТРИСОВКА ДОСКИ, ТАЙМЕРЫ И ИГРОВОЙ ЦИКЛ ---
        const boardEl = document.getElementById('chessboard');

        function createVisualBoard() {
            boardEl.innerHTML = '';
            for (let i = 0; i < 64; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell'; cell.addEventListener('click', () => handleCellClick(i));
                boardEl.appendChild(cell);
            }
        }

        function updateVisualBoard() {
            const cells = boardEl.children; const wCheck = isKingInCheck('w'), bCheck = isKingInCheck('b');
            for (let i = 0; i < 64; i++) {
                const cell = cells[i], piece = boardState[i]; cell.innerHTML = ''; cell.className = 'cell';
                if (piece) {
                    const pieceEl = document.createElement('div');
                    pieceEl.className = `piece ${piece.color === 'w' ? 'white-p' : 'black-p'}`;
                    pieceEl.innerText = PIECES[piece.color][piece.type]; cell.appendChild(pieceEl);
                    if (piece.type === 'k' && ((piece.color === 'w' && wCheck) || (piece.color === 'b' && bCheck))) cell.classList.add('check-warning');
                }
                if (selectedCell === i) cell.classList.add('selected');
                const move = validMoves.find(m => m.to === i);
                if (move) cell.classList.add(boardState[i] || move.type === 'enPassant' ? 'valid-attack' : 'valid-move');
            }
            document.getElementById('panel-white').classList.toggle('active', currentTurn === 'w');
            document.getElementById('panel-black').classList.toggle('active', currentTurn === 'b');
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!gameActive) return; timers[currentTurn]--;
                document.getElementById('timer-white').innerText = `${Math.floor(timers.w / 60).toString().padStart(2, '0')}:${(timers.w % 60).toString().padStart(2, '0')}`;
                document.getElementById('timer-black').innerText = `${Math.floor(timers.b / 60).toString().padStart(2, '0')}:${(timers.b % 60).toString().padStart(2, '0')}`;
                if (timers[currentTurn] <= 0) {
                    clearInterval(timerInterval); gameActive = false; AudioEngine.play('gameover');
                    showModal('Время истекло ⏳', `${currentTurn === 'w' ? 'Компьютер' : 'Вы'} выиграли по времени!`);
                }
            }, 1000);
        }

        function logMove(from, to, piece, isCapture) {
            const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'], ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];
            const notation = piece.type.toUpperCase() + files[from % 8] + ranks[Math.floor(from / 8)] + (isCapture ? 'x' : '-') + files[to % 8] + ranks[Math.floor(to / 8)];
            const logEl = document.getElementById('moves-log');
            if (piece.color === 'w') {
                const row = document.createElement('div'); row.className = 'moves-row';
                row.innerHTML = `<span class="move-num">${Math.floor(moveHistory.length / 2) + 1}.</span><span>${notation}</span><span id="black-move-slot"></span>`;
                logEl.appendChild(row);
            } else {
                const slots = logEl.getElementsByTagName('span');
                for (let s of slots) { if (s.id === 'black-move-slot') { s.innerText = notation; s.removeAttribute('id'); break; } }
            }
            moveHistory.push(notation); logEl.scrollTop = logEl.scrollHeight;
        }

        function handleCellClick(idx) {
            if (!gameActive || currentTurn === 'b') return;
            const move = validMoves.find(m => m.to === idx);
            if (move) { executeMove(selectedCell, idx, move); } 
            else if (boardState[idx] && boardState[idx].color === 'w') {
                selectedCell = idx; validMoves = getValidMoves(idx); updateVisualBoard();
            } else { selectedCell = null; validMoves = []; updateVisualBoard(); }
        }

        function executeMove(from, to, move) {
            const piece = boardState[from], isCapture = boardState[to] !== null || move.type === 'enPassant';
            AudioEngine.play(isCapture ? 'capture' : 'move');

            if (move.type === 'castle_king') {
                boardState[to] = piece; boardState[from] = null; boardState[to - 1] = boardState[to + 1]; boardState[to + 1] = null;
            } else if (move.type === 'castle_queen') {
                boardState[to] = piece; boardState[from] = null; boardState[to + 1] = boardState[to - 2]; boardState[to - 2] = null;
            } else if (move.type === 'enPassant') {
                boardState[to] = piece; boardState[from] = null; boardState[to - (piece.color === 'w' ? -8 : 8)] = null;
            } else { boardState[to] = piece; boardState[from] = null; }

            logMove(from, to, piece, isCapture);

            if (piece.type === 'k') movedState[`${piece.color}K`] = true;
            if (piece.type === 'r') {
                if (from === 56) movedState.wR_A = true; if (from === 63) movedState.wR_H = true;
                if (from === 0) movedState.bR_A = true; if (from === 7) movedState.bR_H = true;
            }
            enPassantTarget = (piece.type === 'p' && Math.abs(Math.floor(to / 8) - Math.floor(from / 8)) === 2) ? (from + to) / 2 : null;

            const targetRank = Math.floor(to / 8);
            if (piece.type === 'p' && (targetRank === 0 || targetRank === 7)) {
                if (piece.color === 'w') {
                    gameActive = false;
                    showModal('Превращение пешки 👑', 'Выберите фигуру:', `
                        <div class="promo-options">
                            <button class="promo-btn" onclick="completePromo(${to}, 'q')">♕</button>
                            <button class="promo-btn" onclick="completePromo(${to}, 'r')">♖</button>
                            <button class="promo-btn" onclick="completePromo(${to}, 'b')">♗</button>
                            <button class="promo-btn" onclick="completePromo(${to}, 'n')">♘</button>
                        </div>`); return;
                } else { boardState[to].type = 'q'; }
            }
            finalizeTurn();
        }

        window.completePromo = function(idx, type) { boardState[idx].type = type; closeModal(); gameActive = true; finalizeTurn(); };

        function finalizeTurn() {
            currentTurn = currentTurn === 'w' ? 'b' : 'w'; selectedCell = null; validMoves = []; updateVisualBoard(); startTimer();
            const hasMoves = hasValidMoves(currentTurn), check = isKingInCheck(currentTurn); if (check) AudioEngine.play('check');
            if (!hasMoves) {
                gameActive = false; clearInterval(timerInterval); AudioEngine.play('gameover');
                if (check) showModal('Мат! 🏆', currentTurn === 'w' ? 'Компьютер победил!' : 'Вы победили!');
                else showModal('Ничья 🤝', 'На доске Пат.'); return;
            }
            if (currentTurn === 'b' && gameActive) setTimeout(makeAIMove, 200);
        }

        function hasValidMoves(color) {
            for (let i = 0; i < 64; i++) { if (boardState[i] && boardState[i].color === color && getValidMoves(i).length > 0) return true; } return false;
        }

        document.getElementById('modal-close-btn').addEventListener('click', closeModal);

        function showModal(title, text, contentHTML = '') {
            document.getElementById('modal-title').innerText = title; document.getElementById('modal-text').innerText = text;
            document.getElementById('modal-content-area').innerHTML = contentHTML; document.getElementById('modal-overlay').classList.add('active');
        }

        function closeModal() { document.getElementById('modal-overlay').classList.remove('active'); document.getElementById('modal-content-area').innerHTML = ''; }

        window.addEventListener('DOMContentLoaded', () => {
            createVisualBoard(); initBoardData(); updateVisualBoard(); startTimer();
            document.getElementById('reset-btn').addEventListener('click', () => {
                clearInterval(timerInterval); initBoardData(); document.getElementById('moves-log').innerHTML = '';
                document.getElementById('timer-white').innerText = "10:00"; document.getElementById('timer-black').innerText = "10:00";
                updateVisualBoard(); startTimer();
            });
            document.getElementById('add-time-btn').addEventListener('click', () => { timers.w += 60; timers.b += 60; });
            const ts = document.getElementById('theme-select'); ts.addEventListener('change', (e) => { document.body.className = `theme-${e.target.value}`; });
        });
    </script>
</body>
