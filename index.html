            for (let i = 0; i < 64; i++) {
                if (state[i]) {
                    totalEvaluation += getPieceValue(state[i], i);
                }
            }
            return totalEvaluation;
        }

        function getPieceValue(piece, index) {
            let r = Math.floor(index / 8);
            let c = index % 8;
            
            // Если фигура белая (игрок), инвертируем координаты строки для правильной оценки матриц
            let tableRow = piece.color === 'b' ? r : 7 - r;
            let value = PIECE_VALUES[piece.type];

            if (piece.type === 'p') value += PAWN_TABLE[tableRow][c];
            else if (piece.type === 'n') value += KNIGHT_TABLE[tableRow][c];
            else if (piece.type === 'b') value += BISHOP_TABLE[tableRow][c];
            else if (piece.type === 'r') value += ROOK_TABLE[tableRow][c];
            else if (piece.type === 'q') value += QUEEN_TABLE[tableRow][c];
            else if (piece.type === 'k') value += KING_TABLE[tableRow][c];

            return piece.color === 'b' ? value : -value;
        }

        // Алгоритм Минимакс с альфа-бета отсечением (глубина 2 хода для высокой скорости в браузере)
        function minimax(state, depth, alpha, beta, isMaximizing) {
            if (depth === 0) return [evaluateBoard(state), null];

            let moves = getAllValidMoves(isMaximizing ? 'b' : 'w', state);
            if (moves.length === 0) return [isMaximizing ? -15000 : 15000, null];

            // Простая сортировка ходов (сначала взятия) для ускорения альфа-бета отсечения
            moves.sort((a, b) => (state[b.to] ? 1 : 0) - (state[a.to] ? 1 : 0));

            let bestMove = null;

            if (isMaximizing) {
                let maxEval = -Infinity;
                for (let move of moves) {
                    let tempState = [...state];
                    tempState[move.to] = tempState[move.from]; tempState[move.from] = null;
                    let evaluation = minimax(tempState, depth - 1, alpha, beta, false)[0];
                    if (evaluation > maxEval) { maxEval = evaluation; bestMove = move; }
                    alpha = Math.max(alpha, evaluation);
                    if (beta <= alpha) break;
                }
                return [maxEval, bestMove];
            } else {
                let minEval = Infinity;
                for (let move of moves) {
                    let tempState = [...state];
                    tempState[move.to] = tempState[move.from]; tempState[move.from] = null;
                    let evaluation = minimax(tempState, depth - 1, alpha, beta, true)[0];
                    if (evaluation < minEval) { minEval = evaluation; bestMove = move; }
                    beta = Math.min(beta, evaluation);
                    if (beta <= alpha) break;
                }
                return [minEval, bestMove];
            }
        }

        function makeAIMove() {
            if (!gameActive) return;
            // Глубина поиска = 2 полухода (этого достаточно для мгновенного и разумного ответа компьютера)
            let [_, bestMove] = minimax(boardState, 2, -Infinity, Infinity, true);
            if (bestMove) {
                executeMove(bestMove.from, bestMove.to);
            }
        }
        // --- ОТРИСОВКА, ИНТЕРФЕЙС И ОБРАБОТКА ХОДОВ ---
        const boardEl = document.getElementById('chessboard');

        function createVisualBoard() {
            boardEl.innerHTML = '';
            for (let i = 0; i < 64; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.addEventListener('click', () => handleCellClick(i));
                boardEl.appendChild(cell);
            }
        }

        function updateVisualBoard() {
            const cells = boardEl.children;
            const wCheck = isKingInCheck('w'), bCheck = isKingInCheck('b');

            for (let i = 0; i < 64; i++) {
                const cell = cells[i], piece = boardState[i];
                cell.innerHTML = ''; cell.className = 'cell';

                if (piece) {
                    const pieceEl = document.createElement('div');
                    pieceEl.className = 'piece';
                    pieceEl.innerText = PIECES[piece.color][piece.type];
                    if (piece.color === 'b') pieceEl.style.color = '#000';
                    cell.appendChild(pieceEl);

                    if (piece.type === 'k' && ((piece.color === 'w' && wCheck) || (piece.color === 'b' && bCheck))) {
                        cell.classList.add('check-warning');
                    }
                }

                if (selectedCell === i) cell.classList.add('selected');
                const move = validMoves.find(m => m.to === i);
                if (move) cell.classList.add(boardState[i] ? 'valid-attack' : 'valid-move');
            }
            document.getElementById('panel-white').classList.toggle('active', currentTurn === 'w');
            document.getElementById('panel-black').classList.toggle('active', currentTurn === 'b');
        }

        function logMove(from, to, piece, isCapture) {
            const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'], ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];
            const notation = piece.type.toUpperCase() + files[from % 8] + ranks[Math.floor(from / 8)] + (isCapture ? 'x' : '-') + files[to % 8] + ranks[Math.floor(to / 8)];
            const logEl = document.getElementById('moves-log');
            
            if (piece.color === 'w') {
                const row = document.createElement('div'); row.className = 'moves-row';
                row.innerHTML = `<span class="move-num">${Math.floor(moveHistory.length / 2) + 1}.</span><span>${notation}</span><span id="black-move-slot"></span>`;
                logEl.appendChild(row);
            } else {
                const slots = logEl.getElementsByTagName('span');
                for (let s of slots) { if (s.id === 'black-move-slot') { s.innerText = notation; s.removeAttribute('id'); break; } }
            }
            moveHistory.push(notation); logEl.scrollTop = logEl.scrollHeight;
        }

        function handleCellClick(idx) {
            if (!gameActive || currentTurn === 'b') return; // Ход ИИ кликать нельзя
            AudioEngine.init();
            const move = validMoves.find(m => m.to === idx);
            if (move) { executeMove(selectedCell, idx); } 
            else if (boardState[idx] && boardState[idx].color === 'w') {
                selectedCell = idx; validMoves = getValidMoves(idx); updateVisualBoard();
            } else { selectedCell = null; validMoves = []; updateVisualBoard(); }
        }

        function executeMove(from, to) {
            const piece = boardState[from], isCapture = boardState[to] !== null;
            AudioEngine.play(isCapture ? 'capture' : 'move');

            boardState[to] = piece; boardState[from] = null;
            logMove(from, to, piece, isCapture);

            // Автоматическое превращение пешки на последней линии
            const targetRank = Math.floor(to / 8);
            if (piece.type === 'p' && (targetRank === 0 || targetRank === 7)) {
                boardState[to].type = 'q'; // Превращаем в ферзя
            }

            finalizeTurn();
        }

        function finalizeTurn() {
            currentTurn = currentTurn === 'w' ? 'b' : 'w'; selectedCell = null; validMoves = [];
            updateVisualBoard();

            const hasMoves = hasValidMoves(currentTurn), check = isKingInCheck(currentTurn);
            if (check) AudioEngine.play('check');

            if (!hasMoves) {
                gameActive = false; AudioEngine.play('gameover');
                if (check) { showModal('Мат! 🏆', currentTurn === 'w' ? 'Компьютер победил!' : 'Вы победили Компьютер!'); } 
                else { showModal('Ничья 🤝', 'На доске зафиксирован Пат.'); }
                return;
            }

            // Если настал ход Компьютера (Черных), запускаем его ИИ с небольшой задержкой (для реалистичности)
            if (currentTurn === 'b' && gameActive) {
                setTimeout(makeAIMove, 250);
            }
        }

        function hasValidMoves(color) {
            for (let i = 0; i < 64; i++) { if (boardState[i] && boardState[i].color === color && getValidMoves(i).length > 0) return true; }
            return false;
        }

        function showModal(title, text) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-text').innerText = text;
            document.getElementById('modal-overlay').classList.add('active');
        }

        function closeModal() { document.getElementById('modal-overlay').classList.remove('active'); }

        function initControls() {
            document.getElementById('reset-btn').addEventListener('click', () => {
                initBoardData(); document.getElementById('moves-log').innerHTML = ''; updateVisualBoard();
            });
            const ts = document.getElementById('theme-select');
            ts.addEventListener('change', (e) => { document.body.className = `theme-${e.target.value}`; });
            document.getElementById('modal-close-btn').addEventListener('click', closeModal);
        }

        window.addEventListener('DOMContentLoaded', () => { createVisualBoard(); initBoardData(); initControls(); updateVisualBoard(); });
    </script>
</body>
