                if (score > maxScore) { maxScore = score; bestMove = move; }
            }

            executeMove(bestMove.from, bestMove.to);
        }
        // --- ИНТЕРФЕЙС И ЦИКЛ ХОДОВ ---
        const boardEl = document.getElementById('chessboard');

        function createVisualBoard() {
            boardEl.innerHTML = '';
            for (let i = 0; i < 64; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.addEventListener('click', () => handleCellClick(i));
                boardEl.appendChild(cell);
            }
        }

        function updateVisualBoard() {
            const cells = boardEl.children;
            const wCheck = isKingInCheck('w'), bCheck = isKingInCheck('b');

            for (let i = 0; i < 64; i++) {
                const cell = cells[i], piece = boardState[i];
                cell.innerHTML = ''; cell.className = 'cell';

                if (piece) {
                    const pieceEl = document.createElement('div');
                    pieceEl.className = `piece ${piece.color === 'w' ? 'white-p' : 'black-p'}`;
                    pieceEl.innerText = PIECES[piece.color][piece.type];
                    cell.appendChild(pieceEl);

                    if (piece.type === 'k' && ((piece.color === 'w' && wCheck) || (piece.color === 'b' && bCheck))) {
                        cell.classList.add('check-warning');
                    }
                }

                if (selectedCell === i) cell.classList.add('selected');
                const move = validMoves.find(m => m.to === i);
                if (move) cell.classList.add(boardState[i] ? 'valid-attack' : 'valid-move');
            }
            document.getElementById('panel-white').classList.toggle('active', currentTurn === 'w');
            document.getElementById('panel-black').classList.toggle('active', currentTurn === 'b');
        }

        function logMove(from, to, piece, isCapture) {
            const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'], ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];
            const notation = piece.type.toUpperCase() + files[from % 8] + ranks[Math.floor(from / 8)] + (isCapture ? 'x' : '-') + files[to % 8] + ranks[Math.floor(to / 8)];
            const logEl = document.getElementById('moves-log');
            
            if (piece.color === 'w') {
                const row = document.createElement('div'); row.className = 'moves-row';
                row.innerHTML = `<span class="move-num">${Math.floor(moveHistory.length / 2) + 1}.</span><span>${notation}</span><span id="black-move-slot"></span>`;
                logEl.appendChild(row);
            } else {
                const slots = logEl.getElementsByTagName('span');
                for (let s of slots) { if (s.id === 'black-move-slot') { s.innerText = notation; s.removeAttribute('id'); break; } }
            }
            moveHistory.push(notation); logEl.scrollTop = logEl.scrollHeight;
        }

        function handleCellClick(idx) {
            if (!gameActive || currentTurn === 'b') return;
            const move = validMoves.find(m => m.to === idx);
            if (move) { executeMove(selectedCell, idx); } 
            else if (boardState[idx] && boardState[idx].color === 'w') {
                selectedCell = idx; validMoves = getValidMoves(idx); updateVisualBoard();
            } else { selectedCell = null; validMoves = []; updateVisualBoard(); }
        }

        function executeMove(from, to) {
            const piece = boardState[from], isCapture = boardState[to] !== null;
            AudioEngine.play(isCapture ? 'capture' : 'move');

            boardState[to] = piece; boardState[from] = null;
            logMove(from, to, piece, isCapture);

            if (piece.type === 'p' && (Math.floor(to / 8) === 0 || Math.floor(to / 8) === 7)) boardState[to].type = 'q';
            finalizeTurn();
        }

        function finalizeTurn() {
            currentTurn = currentTurn === 'w' ? 'b' : 'w'; selectedCell = null; validMoves = [];
            updateVisualBoard();

            const hasMoves = hasValidMoves(currentTurn), check = isKingInCheck(currentTurn);
            if (check) AudioEngine.play('check');

            if (!hasMoves) {
                gameActive = false; AudioEngine.play('gameover');
                if (check) { showModal('Мат! 🏆', currentTurn === 'w' ? 'Компьютер победил!' : 'Вы победили!'); } 
                else { showModal('Ничья 🤝', 'На доске Пат.'); }
                return;
            }

            if (currentTurn === 'b' && gameActive) {
                setTimeout(makeAIMove, 400);
            }
        }

        function hasValidMoves(color) {
            for (let i = 0; i < 64; i++) { if (boardState[i] && boardState[i].color === color && getValidMoves(i).length > 0) return true; }
            return false;
        }

        function showModal(title, text) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-text').innerText = text;
            document.getElementById('modal-overlay').classList.add('active');
        }

        function closeModal() { document.getElementById('modal-overlay').classList.remove('active'); }

        window.addEventListener('DOMContentLoaded', () => {
            createVisualBoard(); initBoardData(); updateVisualBoard();
            document.getElementById('reset-btn').addEventListener('click', () => {
                initBoardData(); document.getElementById('moves-log').innerHTML = ''; updateVisualBoard();
            });
            const ts = document.getElementById('theme-select');
            ts.addEventListener('change', (e) => { document.body.className = `theme-${e.target.value}`; });
            document.getElementById('modal-close-btn').addEventListener('click', closeModal);
        });
    </script>
</body>
</html>
